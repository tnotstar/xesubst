[package]
name = "xesubst"
version = "0.2.0"
edition = "2024"
description = "A Bash-compatible envsubst replacement in Rust"
license = "MIT OR Apache-2.0"

[[bin]]
name = "xes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

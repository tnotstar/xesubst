[package]
name = "xes"
version = "0.1.0"
edition = "2024"
description = "A Bash-compatible envsubst replacement in Rust"
license = "MIT OR Apache-2.0"

[[bin]]
name = "xes"
path = "src/main.rs"

[dependencies]
xesubst = { path = "../xesubst" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"
